name: Build & Release ViTai

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-x11-0 \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libdbus-1-3 \
            wl-clipboard \
            xclip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          python -m pytest -v

  build-windows:
    name: Build Windows Binary
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          python scripts/build_windows.py

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ViTai/* -DestinationPath dist/ViTai-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViTai-Windows-x64
          path: dist/ViTai-Windows-x64.zip

  build-linux:
    name: Build Linux Binary
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxtst-dev \
            libxkbcommon-x11-0 \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libdbus-1-3 \
            wl-clipboard \
            xclip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViTai-Linux-x86_64
          path: dist/ViTai-Linux-x86_64.tar.gz

  build-macos:
    name: Build macOS App
    needs: test
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build macOS App Bundle
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViTai-MacOS
          path: dist/ViTai-v3.0.1-macos-*.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ViTai-Windows-x64
          path: release/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ViTai-Linux-x86_64
          path: release/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ViTai-MacOS
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ViTai-Windows-x64.zip
            release/ViTai-Linux-x86_64.tar.gz
            release/ViTai-v3.0.1-macos-*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true

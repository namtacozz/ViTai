name: Build & Release ViTai

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Binary
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          python scripts/build_windows.py

      - name: Compress Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ViTai/* -DestinationPath dist/ViTai-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViTai-Windows-x64
          path: dist/ViTai-Windows-x64.zip

  build-linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wl-clipboard libx11-dev libxtst-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller evdev python-xlib

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "ViTai" \
            --icon "assets/icon.ico" \
            --add-data "assets:assets" \
            --paths "src" \
            src/vitai/main.py
          cp .env.example dist/ViTai/.env 2>/dev/null || true
          cp README.md dist/ViTai/ 2>/dev/null || true
          cd dist
          tar -czvf ViTai-Linux-x86_64.tar.gz ViTai
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViTai-Linux-x86_64
          path: dist/ViTai-Linux-x86_64.tar.gz

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyobjc-framework-Cocoa pyobjc-framework-Quartz

      - name: Build macOS App Bundle
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViTai-MacOS
          path: dist/ViTai-MacOS.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ViTai-Windows-x64
          path: release/

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ViTai-Linux-x86_64
          path: release/

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ViTai-MacOS
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ViTai-Windows-x64.zip
            release/ViTai-Linux-x86_64.tar.gz
            release/ViTai-MacOS.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
